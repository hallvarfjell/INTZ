<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  />

  <meta
    name="theme-color"
    content="#f7fafc"
  />

  <title>INTZ v10.1</title>

  <link
    rel="manifest"
    href="./manifest.json"
  />

  <link
    rel="stylesheet"
    href="./style.css"
  />

  <script
    src="https://unpkg.com/phosphor-icons@1.4.2"
  ></script>
</head>

<body>

<header
  class="topbar"
  id="topbar"
>
  <div class="nav">
    <a
      href="#dashboard"
      data-nav="dashboard"
    >
      <strong>INTZ</strong>
    </a>

    <a
      href="#dashboard"
      data-nav="dashboard"
    >
      Hovedside
    </a>

    <a
      href="#builder"
      data-nav="builder"
    >
      Øktbygger
    </a>

    <a
      href="#log"
      data-nav="log"
    >
      Logg
    </a>

    <a
      href="#settings"
      data-nav="settings"
    >
      Innstillinger
    </a>

    <a
      href="#help"
      data-nav="help"
    >
      Hjelp
    </a>
  </div>

  <div class="devicectl">
    <button
      id="connect-hr"
      class="btn-device disconnected"
      title="Koble til puls"
      type="button"
    >
      <i class="ph-heart"></i>
      <span>Puls</span>
    </button>

    <button
      id="connect-treadmill"
      class="btn-device disconnected"
      title="Koble til mølle"
      type="button"
    >
      <i class="ph-trend-up"></i>
      <span>Mølle</span>
    </button>
  </div>
</header>

<div id="spa-root">

  <!-- DASHBOARD -->

  <section data-view="dashboard">
    <div class="layout">

      <section class="leftcol">

        <div
          class="card metrics"
          id="dashboard"
        >
          <div
            class="metric metric-big"
            style="display:flex;align-items:baseline;gap:8px"
          >
            <label
              style="width:170px;color:#5f6b7a"
            >
              Puls
            </label>

            <span
              id="pulse"
              class="big-num"
              style="font-size:56px;line-height:1;color:#ef4444"
            >
              --
            </span>

            <small>bpm</small>
          </div>

          <div
            class="metric"
            style="display:flex;align-items:baseline;gap:8px"
          >
            <label
              style="width:170px;color:#5f6b7a"
            >
              Estimert watt
            </label>

            <span id="watt">--</span>
            <small>W</small>
          </div>

          <div
            class="metric"
            style="display:flex;align-items:baseline;gap:8px"
          >
            <label
              style="width:170px;color:#5f6b7a"
            >
              Slope (20s–120s)
            </label>

            <span id="slope">--</span>
            <small>bpm</small>
          </div>

          <div
            class="rpe-compact"
            style="display:flex;align-items:center;gap:8px;margin-top:6px"
          >
            <label
              for="rpe-now"
              id="rpe-label"
              style="width:170px;color:#5f6b7a"
            >
              RPE nå: –
            </label>

            <button
              id="rpe-dec"
              class="iconbtn"
              title="-0,5"
              type="button"
            >
              <i class="ph-minus"></i>
            </button>

            <input
              id="rpe-now"
              type="number"
              step="0.5"
              min="0"
              max="10"
              value="0"
              class="bigvalue"
              style="width:120px;text-align:center"
            />

            <button
              id="rpe-inc"
              class="iconbtn"
